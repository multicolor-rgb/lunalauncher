[package]
name = "lunaclient"
version = "0.1.0"
description = "Unofficial Amazon Luna launcher with a gamepad-first UI"
authors = ["Luna Client contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lunaclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilrs = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
